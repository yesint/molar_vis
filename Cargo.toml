[workspace]
members = ["crates/molar_vis_core", "crates/molar_vis", "crates/molar_vis_web", "crates/molar_vis_py", "crates/molar_vis_js"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Artistic-2.0"
authors = ["Semen Yesylevskyy"]
repository = "https://github.com/yesint/molar_vis"

[workspace.dependencies]
egui = "0.34"
eframe = { version = "0.34", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
egui-wgpu = "0.34"
wgpu = "29"
glam = { version = "0.32", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# molar (default features => Float = f32), from GitHub so the crate is installable
# without a local sibling checkout. molar pulls its own powersasa git dependency.
# Pinned to **molar 2.1** (rev 8f66104): struct-of-arrays `AtomStorage`/`BondStorage`
# with the `AtomRef`/`AtomRefMut`/`BondRef` borrowed proxies (there is no `&Atom` or
# `&Bond` any more), a cached `BondAdjacency` inside `BondStorage`, non-mutating
# `perception::sssr_rings`, SDF `M  CHG` formal charges, and edition 2024. Also carries
# everything the older pin did: molecular perception, SDF io, bond orders, the wasm
# runtime, structured selection parse errors (`SyntaxError`), `Sel::bind_to`, the pub
# pymolar accessors + `register_molar`, and the State coords-version counter. Rev 4098139
# additionally restores `perception::implicit_hydrogens` (dropped as caller-less by the
# columnar-bond migration; the structure editor's hydrogen toggle is its caller).
molar = { git = "https://github.com/yesint/molar.git", rev = "4098139", default-features = false }
# pymolar (PyO3 bindings), as an rlib, for the native molar_vis Python module only.
# Same git rev as `molar` above so the molar types unify across the dependency graph.
molar_python = { git = "https://github.com/yesint/molar.git", rev = "4098139" }
# GAFF/GAFF2 atom typing + espaloma-charge partial charges (the `espaloma` feature
# bundles a ~600 kB ONNX GNN and pulls `tract-onnx`). Drives the "Compute charges"
# button behind the `Charge` coloring scheme. Same git rev as `molar`.
molar_ff = { git = "https://github.com/yesint/molar.git", rev = "4098139", default-features = false, features = [
    "espaloma",
] }
# Pure-Rust embedded scripting language for the in-app command console (native + wasm).
# default-features=false + "std" == Rhai's own default; single-threaded (no "sync"), no time deps.
rhai = { version = "1", default-features = false, features = ["std"] }

# Debuggable own-code, fast dependencies (wgpu/molar hot loops) in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
