[workspace]
members = ["crates/molar_vis_core", "crates/molar_vis", "crates/molar_vis_web", "crates/molar_vis_py", "crates/molar_vis_js"]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "Artistic-2.0"
authors = ["Semen Yesylevskyy"]
repository = "https://github.com/yesint/molar_vis"

[workspace.dependencies]
egui = "0.34"
eframe = { version = "0.34", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
egui-wgpu = "0.34"
wgpu = "29"
glam = { version = "0.32", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The theme sheets (`crates/molar_vis_core/themes/*.toml`) are read by this crate: a general-purpose
# egui utility that lives outside this workspace (repo: github.com/yesint/egui-stylesheet), so it can
# be reused on its own. Published to crates.io, so this is a plain registry dep. To develop the two
# together, temporarily add
#   [patch.crates-io]
#   egui-stylesheet = { path = "../egui-stylesheet" }
# and don't commit it.
egui-stylesheet = "0.1"
# Published Molar packages use the same release so Rust and Python types unify.
# The default coordinate precision is f32; the fixed Espaloma kernel needs no ONNX runtime.
molar = { version = "=2.4.0", default-features = false }
molar_python = { version = "=2.4.0" }
molar_ff = { version = "=2.4.0", default-features = false }

# Debuggable own-code, fast dependencies (wgpu/molar hot loops) in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Pin the PDB alternate-location fix; keep Rust and Python Molar types unified.
[patch.crates-io]
molar = { git = "https://github.com/yesint/molar.git", rev = "10880f0c22f35723544674910c112dba7db69817" }
molar_ff = { git = "https://github.com/yesint/molar.git", rev = "10880f0c22f35723544674910c112dba7db69817" }
molar_python = { git = "https://github.com/yesint/molar.git", rev = "10880f0c22f35723544674910c112dba7db69817" }
