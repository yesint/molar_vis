[workspace]
members = ["crates/molar_vis_core", "crates/molar_vis", "crates/molar_vis_web", "crates/molar_vis_py", "crates/molar_vis_js"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Artistic-2.0"
authors = ["Semen Yesylevskyy"]
repository = "https://github.com/yesint/molar_vis"

[workspace.dependencies]
egui = "0.34"
eframe = { version = "0.34", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
egui-wgpu = "0.34"
wgpu = "29"
glam = { version = "0.32", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The theme sheets (`crates/molar_vis_core/themes/*.toml`) are read by this crate: a general-purpose
# egui utility that lives outside this workspace (repo: github.com/yesint/egui-stylesheet), so it can
# be reused on its own. Published to crates.io, so this is a plain registry dep. To develop the two
# together, temporarily add
#   [patch.crates-io]
#   egui-stylesheet = { path = "../egui-stylesheet" }
# and don't commit it.
egui-stylesheet = "0.1"
# molar (default features => Float = f32), from GitHub so the crate is installable
# without a local sibling checkout. molar pulls its own powersasa git dependency.
# Pinned to Molar 2.2 revision cc225ee. This revision supplies the columnar atom and
# bond stores, fallible distance searches, chemistry perception, the Python bindings,
# and the fixed Espaloma charge kernel used by the viewer.
molar = { git = "https://github.com/yesint/molar.git", rev = "cc225ee", default-features = false }
# pymolar (PyO3 bindings), as an rlib, for the native molar_vis Python module only.
# Same git rev as `molar` above so the molar types unify across the dependency graph.
molar_python = { git = "https://github.com/yesint/molar.git", rev = "cc225ee" }
# GAFF/GAFF2 atom typing + always-available Espaloma partial charges. The fixed
# Espaloma kernel does not pull a general ONNX run time. Drives the "Compute charges"
# button behind the `Charge` coloring scheme. Same git rev as `molar`.
molar_ff = { git = "https://github.com/yesint/molar.git", rev = "cc225ee", default-features = false }
# Pure-Rust embedded scripting language for the in-app command console (native + wasm).
# default-features=false + "std" == Rhai's own default; single-threaded (no "sync"), no time deps.
rhai = { version = "1", default-features = false, features = ["std"] }

# Debuggable own-code, fast dependencies (wgpu/molar hot loops) in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
