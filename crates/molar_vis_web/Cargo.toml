[package]
name = "molar_vis_web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Browser/wasm entry point for the viewer, built by `trunk` (see index.html).
# Native builds compile a stub `main` so the workspace still builds end-to-end.
[[bin]]
name = "molar_vis_web"
path = "src/main.rs"

[dependencies]
molar_vis_core = { version = "0.3.0", path = "../molar_vis_core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
molar.workspace = true
