[package]
name = "molar_vis_web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Browser/wasm entry point for the viewer, built by `trunk` (see index.html).
# Native builds compile a stub `main` so the workspace still builds end-to-end.
[[bin]]
name = "molar_vis_web"
path = "src/main.rs"

[features]
# Pass-through for the core's in-app Rhai scripting console (off by default — see
# `molar_vis_core`'s own `scripting` feature). Build with `--features scripting` to get it.
scripting = ["molar_vis_core/scripting"]

[dependencies]
molar_vis_core = { path = "../molar_vis_core" }
