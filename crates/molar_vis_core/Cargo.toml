[package]
name = "molar_vis_core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "molar_vis_core"
path = "src/lib.rs"

[features]
# The in-app **Rhai scripting console**. Off by default: Rhai (~0.5 MB of engine) and its
# console UI are a convenience for interactive use, and an embedding that drives the viewer
# from its own host language — the Python module, the browser JS API — has no use for them.
# The `Command`/`apply_scene_command` layer those hosts *do* use is always compiled.
scripting = ["dep:rhai"]

[dependencies]
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
log.workspace = true
molar = { workspace = true }
rhai = { workspace = true, optional = true }
egui-phosphor = "0.12.0"
serde = { workspace = true }
serde_json = { workspace = true }
# Pure-Rust PNG encode for "Save image" (offscreen render → file/download). Lean
# feature set (png only) keeps the wasm bundle small; `imageops` rides along for the
# SSAA→output downsample. Works on native + wasm.
image = { version = "0.25", default-features = false, features = ["png"] }

# Native file-open dialog for loading trajectories. Target-gated so cargo never
# tries to resolve/build it for wasm32 (the browser uses rfd's async web picker).
# `directories` resolves the platform config dir for the persisted settings file
# (`~/.config/molar_vis/settings.json` on Linux); the wasm build has no filesystem
# and keeps settings in memory, so it's native-only too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
directories = "5"
# espaloma partial charges (the `Charge` coloring's [Compute charges] button). Native only:
# it bundles a ~600 kB ONNX model and pulls `tract`, neither of which belongs in the wasm
# bundle — and the browser build has no way to obtain charges anyway. Charge *coloring*
# itself is platform-independent and lives in `color.rs`.
molar_ff = { workspace = true }
fontdb = { version = "0.23.0", default-features = false, features = ["fs", "fontconfig"] }

# Browser runtime: the eframe `WebRunner` entry (`launch::run_web`) needs the
# canvas + async glue; `wgpu`'s `webgl` feature gives a WebGL2 fallback for
# browsers without WebGPU; `getrandom`'s `wasm_js` backend (+ the matching cfg in
# `.cargo/config.toml`) keeps transitive RNG users from panicking. The file picker
# is implemented directly on `web-sys` (`<input type=file>` + `Blob::array_buffer`)
# since rfd's build script doesn't support wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
wgpu = { workspace = true, features = ["webgl"] }
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "Blob",
    # "Save image" download: build a Blob → object URL → a synthetic <a download> click.
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
] }
