<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>molar_vis — JS API demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050510;
      }
      /* eframe renders into this canvas; fill the window. */
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Keep startup errors visible until the viewer is ready. */
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8ab4ff;
        font: 16px system-ui, sans-serif;
        padding: 2rem;
        box-sizing: border-box;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="molar_vis_canvas"></canvas>
    <div id="loading">Loading molar_vis…</div>

    <!--
      This page is both the GitHub Pages demo *and* the canonical usage example: it
      drives the viewer entirely through the public JavaScript API (the same surface an
      embedding host would use), so the API can't silently rot. It imports the
      wasm-pack-built ES module from ./pkg/ and fetches the bundled 2lao.pdb.
    -->
    <script type="module">
      function showError(error) {
        console.error(error);
        let el = document.getElementById("loading");
        if (!el) {
          el = document.createElement("div");
          el.id = "loading";
          document.body.append(el);
        }
        el.setAttribute("role", "alert");
        el.textContent = "molar_vis failed to start: " + (error?.message ?? error);
      }
      // Rust panics and asynchronous renderer failures can occur outside main().
      window.addEventListener("error", event => showError(event.error ?? event.message));
      window.addEventListener("unhandledrejection", event => showError(event.reason));

      async function main() {
        // Import inside the guarded startup path so download errors are visible too.
        const { default: init, start_embedded, System } = await import("./pkg/molar_vis.js");
        // 1. Instantiate the wasm module (downloads + compiles the .wasm).
        await init();

        // 2. Wait for graphics initialization, then show the full demo controls.
        const vis = await start_embedded("molar_vis_canvas");
        await vis.set_ui_visibility(true, true);

        // 3. Fetch a structure and parse it (bytes -> a molar System).
        const response = await fetch("./2lao.pdb");
        if (!response.ok) throw new Error(`Cannot load 2lao.pdb: HTTP ${response.status}`);
        const buf = await response.arrayBuffer();
        const sys = System.from_bytes("2lao.pdb", new Uint8Array(buf));

        // 4. Render it, then add an SS-colored cartoon over the protein.
        const mol = vis.add_mol(sys);
        const rep = mol.add_rep(sys.select("protein"), "cartoon", "ss");

        // 5. A couple of view tweaks, just to exercise the controls.
        vis.background_gradient([0.02, 0.02, 0.06], [0.10, 0.12, 0.20]);
        vis.projection("perspective");

        // Console oracle for the headless smoke test (see the crate README / plan).
        const molecules = await vis.mols();
        const representations = await mol.reps();
        console.log(`molar_vis demo: ${sys.name} (${sys.numAtoms} atoms), ` +
                    `protein = ${sys.select("protein").numAtoms} atoms; ` +
                    `mols=${molecules.length}, reps=${representations.length}`);

        // Expose handles for interactive poking from the devtools console.
        Object.assign(window, { vis, sys, mol, rep });

        // The scene queries above complete on the viewer's update loop. Canvas
        // resizing alone does not mean graphics initialization succeeded.
        const loading = document.getElementById("loading");
        if (!loading?.hasAttribute("role")) loading?.remove();
      }

      main().catch(showError);
    </script>
  </body>
</html>
